# Purpose:
# CI workflow for lint-free tests on the backend.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        env:
          # Keep tests offline & deterministic (align with backend/tests/conftest.py).
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          EMBEDDINGS_PROVIDER: stub
          PROMPT_CACHE_ENABLED: "false"
          # Additional determinism (stable hashing, stable tz).
          PYTHONHASHSEED: "0"
          TZ: UTC
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint
