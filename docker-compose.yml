# Purpose:
# Local development orchestration for backend services.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # NEXT_PUBLIC_* variables must be present when Next.js compiles client bundles.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    volumes:
    - ./frontend:/app
    - /app/node_modules
    - /app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/knowledge:ro
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - EMBEDDINGS_DIMENSIONS=${EMBEDDINGS_DIMENSIONS}
      - ROUTER_MODEL=${ROUTER_MODEL}
      - SYNTHESIS_MODEL=${SYNTHESIS_MODEL}
      - SYNTHESIS_TEMPERATURE=${SYNTHESIS_TEMPERATURE}
      - PROMPT_CACHE_ENABLED=${PROMPT_CACHE_ENABLED}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Web security / CORS
      - COOKIE_SECURE=${COOKIE_SECURE}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}

      # Privacy-first interaction logging / client metadata
      - IP_HASH_SALT=${IP_HASH_SALT}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}

      # Optional GeoIP (default OFF unless enabled in host .env)
      - GEOIP_ENABLED=${GEOIP_ENABLED}
      - GEOIP_PROVIDER=${GEOIP_PROVIDER}
      - GEOIP_URL=${GEOIP_URL}
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=${PGDATA:-/var/lib/postgresql/data/pgdata}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:

