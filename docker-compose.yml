# Purpose:
# Local development orchestration for backend services.

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
    - ./frontend:/app
    - /app/node_modules
    - /app/.next

  backend:
     build:
      context: ./backend
      dockerfile: Dockerfile.dev
   ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/knowledge:ro
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ask_piotr
      - EMBEDDINGS_PROVIDER=openai
      - EMBEDDINGS_MODEL=text-embedding-3-small
      - ROUTER_MODEL=gpt-4.1-mini
      - SYNTHESIS_MODEL=gpt-4o-mini
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Web security / CORS
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}

      # Privacy-first interaction logging / client metadata
      - IP_HASH_SALT=${IP_HASH_SALT}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}

      # Optional GeoIP (default OFF unless enabled in host .env)
      - GEOIP_ENABLED=${GEOIP_ENABLED}
      - GEOIP_PROVIDER=${GEOIP_PROVIDER}
      - GEOIP_URL=${GEOIP_URL}
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ask_piotr
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:

